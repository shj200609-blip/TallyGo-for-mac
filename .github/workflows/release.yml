name: Release macOS and Windows installers

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust target
        run: rustup target add aarch64-apple-darwin

      - name: Install dependencies
        run: npm ci

      - name: Build Apple Silicon DMG
        run: npm run build:mac:arm64

      - name: Stage DMG
        run: |
          DMG_PATH=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)
          test -n "$DMG_PATH"
          mkdir -p release-assets
          cp "$DMG_PATH" release-assets/TallyGo-macOS-Apple-Silicon.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: release-assets/TallyGo-macOS-Apple-Silicon.dmg
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal

      - name: Install dependencies
        run: npm ci

      - name: Build Windows x64 installer
        run: npm run tauri build -- --bundles nsis

      - name: Stage EXE
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if ($null -eq $installer) { throw "NSIS installer was not produced" }
          New-Item -ItemType Directory -Force -Path "release-assets" | Out-Null
          Copy-Item $installer.FullName "release-assets/TallyGo-Windows-x64.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: release-assets/TallyGo-Windows-x64.exe
          if-no-files-found: error

  publish-release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-installer'
          path: release-assets
          merge-multiple: true

      - name: Publish both installers
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: gh release create "$TAG_NAME" release-assets/* --title "$TAG_NAME" --generate-notes --verify-tag
