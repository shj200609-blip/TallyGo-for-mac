name: Release Apple Silicon macOS installer

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust target
        run: rustup target add aarch64-apple-darwin

      - name: Install dependencies
        run: npm ci

      - name: Build Apple Silicon DMG
        run: npm run build:mac:arm64

      - name: Stage DMG
        run: |
          DMG_PATH=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)
          test -n "$DMG_PATH"
          mkdir -p release-assets
          cp "$DMG_PATH" release-assets/TallyGo-macOS-Apple-Silicon.dmg

      - name: Publish DMG
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: gh release create "$TAG_NAME" release-assets/TallyGo-macOS-Apple-Silicon.dmg --title "$TAG_NAME" --generate-notes --verify-tag
